name: Austi CI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/austi-ci.yml
      - .node-version
      - apps/austi/**
      - apps/austi-landing/**
      - convex/**
      - packages/ui/**
      - packages/web-foundation/**
      - tests/convex/**
      - bun.lock
      - oxlint.config.ts
      - package.json
  pull_request:
    paths:
      - .github/workflows/austi-ci.yml
      - .node-version
      - apps/austi/**
      - apps/austi-landing/**
      - convex/**
      - packages/ui/**
      - packages/web-foundation/**
      - tests/convex/**
      - bun.lock
      - oxlint.config.ts
      - package.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: App, landing and backend checks
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version-file: .node-version

      - name: Set up Bun
        id: bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version-file: package.json

      - name: Cache Bun packages
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.bun.outputs.bun-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bunx oxlint apps/austi/src apps/austi-landing/src convex tests/convex

      - name: Typecheck app
        run: bun run --filter austi typecheck

      - name: Typecheck backend
        run: bun run convex:typecheck

      - name: Check landing
        run: bun run --filter austi-landing check

      - name: Test backend
        run: bun run convex:test

      - name: Build app
        run: bun run --filter austi build

      - name: Build landing
        run: bun run --filter austi-landing build
